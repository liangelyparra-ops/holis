<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Un espacio para explorar. Clave, linea y luz.">
  <title>Contemplativa | Personal visual explorations</title>
<link rel="icon" type="image/png" href="/contemplativa/clave/icons/favicon-32.png">
  <style>
    :root { color-scheme: dark; background: #090909; color: #e8e6e2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 12vh;
      padding-bottom: max(32px, 12svh);
    }
    .logo {
      display: block;
      width: min(180px, 55vw);
      height: auto;
      filter: none;
      opacity: .9;
    }
    nav { display: flex; align-items: center; gap: clamp(8px, 3vw, 24px); margin-top: 12px; }
    a {
      display: inline-flex;
      min-width: 44px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      color: #93918e;
      font: 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .04em;
      text-decoration: none;
      transition: color 180ms ease;
    }
    .dot { color: #54524f; font: 12px/1 monospace; user-select: none; }
    a:hover, a:focus-visible { color: #f1efeb; }
    a:focus-visible { outline: 1px solid #93918e; outline-offset: 4px; border-radius: 2px; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/contemplativa/assets/iris.png" width="1192" height="840" alt="Iris">
    <h1 style="font:400 21px/1.3 Georgia,serif;letter-spacing:.02em;margin:26px 0 12px">Contemplativa</h1>
    <p style="max-width:380px;text-align:center;color:#aaa69f;font:13px/1.8 sans-serif;margin:0 0 16px">I don’t have a fixed definition for Contemplativa yet.<br>I’m leaving room to discover what it might become.<br>Choose a space and see where it takes you.</p>
    <nav aria-label="Experiences">
      <a href="/contemplativa/clave" aria-label="Clave — espacio principal">clave</a>
      <span class="dot" aria-hidden="true">·</span>
      <a href="/contemplativa/linea" aria-label="Linea — experimento">linea</a>
      <span class="dot" aria-hidden="true">·</span>
      <a href="/contemplativa/luz" aria-label="Luz — experimento">luz</a>
    </nav>
  </main>
</body>
</html>
